services:
  app:
    build: .
    container_name: ec2-session-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:8.0
    container_name: ec2-session-mysql
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASS}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

volumes:
  mysql-data: